<!DOCTYPE html>
<html>
    <head>
        <title>Daily Notes</title>
        <style>
            html {
                margin: 0;
                padding: 0.5in;

                box-sizing: border-box;
                width: 8.5in;
                height: 11in;
            }

            body {
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                margin: 0;
                padding: 0;
            }
            table {
                border-collapse: collapse;
                font-size: 8pt;
            }
            th, td {
                border: 1px solid black;
                padding: 4px;
                text-align: left;
            }
            th {
                background-color: #f2f2f2;
            }

            .date-cell {
                width: max-content;
            }

            .patient-info-container {
                
                padding: 8px;
                font-size: 8pt;

                table {
                    width: max-content;
                }
                th, td {
                    border-color: transparent;
                }

                .patient-info-title {
                    border-bottom: 1px solid grey;
                    font-size: 10pt;
                    font-weight: bold;
                    margin-bottom: 4px;
                }
                .patient-info {
                    margin: 2px 0;
                }

                .patient-info.label {
                    font-weight: bold;
                }
            }
        </style>
    </head>
    <body>
        <div class="patient-info-container">
            <p class="patient-info-title">Patient Information</p>
            <table>
                <tr>
                    <td class="patient-info label">Name:</td>
                    <td class="patient-info">{{PATIENT_NAME}}</td>
                </tr>
                <tr>
                    <td class="patient-info label">Date of Birth:</td>
                    <td class="patient-info">{{PATIENT_DOB}}</td>
                </tr>
                <tr>
                    <td class="patient-info label">Street Address:</td>
                    <td class="patient-info">{{PATIENT_ADDRESS}}</td>
                </tr>
                <tr>
                    <td class="patient-info label">City/State/ZIP:</td>
                    <td class="patient-info">{{PATIENT_CITY_STATE_ZIP}}</td>
                </tr>
                <tr>
                    <td class="patient-info label">Phone:</td>
                    <td class="patient-info">{{PATIENT_PHONE}}</td>
                </tr>
            </table>
        </div>
        <table>
            {{CONTENT}}
            <!-- <tr>
                <th class="date-cell">Date</th>
                <th>Notes</th>
            </tr>
            <tr>
                <td class="date-cell">{{DATE}}</td>
                <td>{{NOTES}}</td>
            </tr> -->
        </table>
    </body>
</html>
