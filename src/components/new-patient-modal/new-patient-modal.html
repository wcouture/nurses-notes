<modal-frame (clickCaughtEvent)="closeModal()">
    <h3>{{ userExists() ? 'New Patient' : 'Enter User Information' }}</h3>
    <form [formGroup]="newUserForm" (ngSubmit)="onCreatePatient()">
        <input formControlName="name" placeholder="Name" />
        <input formControlName="email" placeholder="Email" type="email" />
        <input formControlName="phone" placeholder="Phone" type="tel" />
        <input formControlName="birthdate" placeholder="Birthdate" type="date" />
        <input formControlName="streetAddress" placeholder="Street Address" />
        <input formControlName="cityStateZip" placeholder="City, State, Zip" />
        <button type="submit" [disabled]="!newUserForm.valid">Create {{ userExists() ? 'Patient' : 'User' }}</button>
    </form>
</modal-frame>
